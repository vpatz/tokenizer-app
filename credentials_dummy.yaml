apiVersion: v1
kind: Secret
metadata:
  name: python-shell-netrc
  namespace: token-project
type: Opaque
stringData:
  .netrc: |
    machine packages.redhat.com login <service-account-name> password <password>
---
apiVersion: v1
kind: Secret
metadata:
  name: lightwell-network-credentials
  namespace: lightwell-repo
type: Opaque
stringData:
  LW_USERNAME: |-
    <service-account-name>
  LW_PASSWORD: |-
    <password>
  username: |-
    <service-account-name>
  password: |-
    <password>
